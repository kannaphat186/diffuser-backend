name: diffuser_app
description: "Scent and Sense Laboratory Diffuser App"
publish_to: 'none'
# v6.0.0 (Apr 2026)
#   - Backend migrated to PostgreSQL (Supabase) — app contract unchanged
#   - Firebase / FCM restored end-to-end
#   - API base URL: production default https://diffuser-backend-1.onrender.com
# v5.2.1 (Apr 2026)
#   - Removed fake Device-Detail "Change Wi-Fi" dialog
#   - Removed manual add-device path
#   - Removed self-service password change
#   - Socket.IO JWT handshake required
version: 6.0.0+36

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.0.0
  intl: any
  package_info_plus: ^8.1.2
  socket_io_client: ^3.1.4
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  flutter_reactive_ble: ^5.4.1
  permission_handler: ^12.0.1

  # v6.0.0 — Firebase / FCM end-to-end.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/fonts/NotoSansThai-Regular.ttf
    - assets/fonts/NotoSansThai-Bold.ttf
    - assets/fonts/NotoSansThai-VariableFont_wdth,wght.ttf
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
    - family: NotoSansThaiVar
      fonts:
        - asset: assets/fonts/NotoSansThai-VariableFont_wdth,wght.ttf

dependency_overrides:
  reactive_ble_mobile:
    path: third_party/reactive_ble_mobile
  package_info_plus: ^8.0.0
  meta: ^1.12.0
  win32: ^5.5.0
